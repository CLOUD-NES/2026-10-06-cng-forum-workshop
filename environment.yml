name: cng-forum-workshop
channels:
  - conda-forge
dependencies:
  - python=3.13
  - dask
  - jupyter-server-proxy
  - fsspec
  - icechunk
  - matplotlib
  - nbgitpuller
  - netcdf4
  - numpy
  - obstore
  - pandas
  - pystac
  - rasterio
  - rustac
  - scipy
  - virtualizarr
  - xarray
  # cloudgeometer's dependencies, from conda-forge so that pip does not
  # downgrade packages of the base image (e.g. tornado, via mitmproxy)
  - async-geotiff
  - boto3
  - geopandas
  - imagecodecs
  - kerchunk
  - mitmproxy
  - rioxarray
  - s3fs
  - shapely
  - zarr
  - pip
  - pip:
    - cloudgeometer
